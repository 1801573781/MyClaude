[pytest]
; 测试文件搜索路径（在项目根目录下的 src/ 中递归查找）
testpaths = src code_output

; 测试文件命名规范
python_files = test_*.py

; 测试类命名规范
python_classes = Test*

; 测试函数命名规范
python_functions = test_*

; 默认命令行参数：详细输出 + 简短错误追溯
addopts = -v --tb=short

; 忽略目录（避免搜索 venv、code_output 等无关目录）
norecursedirs = .git venv .venv env log context .idea __pycache__
