# 互联网搜索工具后端（与 config.yaml 的 web_search 参数段配合使用）
# provider 可选: tavily / bocha / zhipu / duckduckgo
#   tavily      专为 LLM 设计，海外网络环境（免费 1000 次/月）
#   bocha      国产后端，国内直连，中文召回好
#   zhipu      智谱 web-search-pro，国内直连，api_key 可直接复用下方 GLM 段的 key
#   duckduckgo 免 Key，需 pip install duckduckgo-search，稳定性一般
#   zhipu      智谱，api_key，与 LLM api_key 相同， base_url:open.bigmodel.cn/api/paas/v4/tools
web_search:
  provider: "zhipu"
  api_key: "***"
  base_url: "https://open.bigmodel.cn/api/paas/v4/tools"

# 主模型基本参数
main_model:
  provider: "GLM-main"


# 记忆相关的模型参数
memory:
  # 向量化基本参数
  embedding:
    enabled: "True"
    provider: "GLM-Embedding"
    dim: "2048"
    batch_size: "100"

  # 精排模型参数（LLM语义召回）
  llm_re_ranking:
    provider: "GLM-5.2"
    extra_body:
      thinking:
        type: "disabled"

  # 精排模型参数（rerank模型精排）
  rerank_re_ranking:
    provider: "GLM-5.2"
    extra_body:
      thinking:
        type: "disabled"



# 比如，memory extract/compaction/evolution，还有意图压缩。总之，是一个单轮聊天函数
simple_chat:
  provider: "GLM-5.2"
  extra_body:
    thinking:
      type: "disabled"






