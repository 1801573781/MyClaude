# memory_2 专用配置
memory_2:
  # --- 分层容量 ---
  working_memory:
    max_turns: 20           # 工作记忆保留最近 N 轮对话

  short_term:
    max_items: 200          # 短期记忆最多 N 条（未压缩条目）
    ttl_seconds: 86400      # 短期记忆存活时间（秒），超期自动遗忘

  long_term:
    compression_threshold: 0.8  # 未压缩条目数达 short_term.max_items 的此比例时触发压缩

  # --- LLM 召回配置 ---
  llm_retrieval:
    model: "default"            # 使用全局配置的模型，或指定 "deepseek" / "minimax"
    system_prompt_file: "src/memory/memory_2/retrieval_prompt.md"  # LLM 精排系统提示词文件
    max_candidates_per_batch: 50    # 单批最多候选记忆数（受 LLM token 窗口限制）
    temperature: 0.1            # 评分时温度，低温度保证一致性
    max_tokens: 4096            # 评分响应的最大 token
    score_field: "relevance"    # 解析响应时提取的评分字段名

  # --- 候选集预过滤 ---
  prefilter:
    max_candidates: 200         # 送入 LLM 前的最大候选数（超量时按时间排序截断）
    time_window_days: 30        # 仅取最近 N 天的记忆（0 = 不限）
    filter_by_tags: []          # 按标签过滤（空 = 不限），如 ["coding", "debug"]

  # --- 相关性阈值 ---
  scoring:
    min_relevance: 0.50         # 低于此分数的记忆不注入上下文

  # --- 存储 ---
  storage:
    path: "D:/AI/MyClaude/memory_storage/memory2/memory2.json"
    backup_count: 3             # 滚动备份数量

  # --- 检索配置 ---
  retrieval:
    default_top_k: 5            # search() 默认召回条数
    max_top_k: 20               # search() 允许的最大召回条数（防止滥用）
    cache_ttl_seconds: 60       # LLM 评分缓存 TTL（秒）

  # --- 压缩器 ---
  compressor:
    enabled: true
    model: "default"            # 使用全局配置的模型
    max_tokens_per_batch: 4000

  # --- 注入配置 ---
  injection:
    max_tokens: 2000            # 记忆注入的 token 预算
