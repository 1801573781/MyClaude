# memory6 模块配置 —— 基于 Embedding + FAISS + LLM 双路召回

# 数据持久化目录
storage_dir: "memory_storage/memory6"

# 记忆分层容量上限
working_max: 20       # 工作记忆最大条数
short_max: 200        # 短期记忆最大条数
long_max: 1000        # 长期记忆最大条数

# Embedding 配置
embedding_model: "text-embedding-3-small"   # 使用的 Embedding 模型
embedding_dim: 1536                          # 向量维度（需与模型匹配）

# OpenAI 兼容 API（用于 Embedding 和 LLM Rater）
# api_key 不填则从环境变量 OPENAI_API_KEY 读取
api_key: ""
base_url: ""          # 可选，自定义 API 端点

# LLM 精排器配置
enable_llm_rater: true                       # 是否启用 LLM 精排
rater_model: "gpt-3.5-turbo"                # 精排使用的模型

# 混合打分权重（Embedding / 时间衰减 / 重要性）
embedding_weight: 0.6
time_weight: 0.2
importance_weight: 0.2
time_decay_hours: 24    # 时间衰减半衰期（小时）

# 遗忘曲线参数（半衰期，单位小时）
working_half_hours: 1      # 工作记忆：1 小时半衰期
short_half_hours: 24       # 短期记忆：24 小时半衰期
long_half_hours: 168       # 长期记忆：7 天半衰期

# 遗忘阈值：retention 低于此值时删除
retention_threshold: 0.05