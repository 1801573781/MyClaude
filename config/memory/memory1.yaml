# memory_1 专用配置（Embedding + FAISS 向量检索）
memory_1:
  # --- 分层容量 ---
  working_memory:
    max_turns: 20           # 工作记忆保留最近 N 轮对话

  short_term:
    max_items: 200          # 短期记忆最多 N 条
    ttl_seconds: 86400      # 短期记忆存活时间（秒），超期自动遗忘

  long_term:
    max_items: 2000         # 长期记忆最多 N 条
    compression_threshold: 0.8  # 短期记忆占用率达此比例时触发压缩

  # --- Embedding 配置 ---
  embedding:
    provider: "openai"
    model: "text-embedding-3-small"
    dim: 1536               # 向量维度

  # --- FAISS 索引配置 ---
  faiss:
    index_type: "IVFFlat"
    nlist: 100              # IVF 簇数

  # --- 混合打分权重 ---
  scoring:
    semantic_weight: 0.6    # 语义相似度权重
    recency_weight: 0.25    # 时间新近度权重
    importance_weight: 0.15 # 重要性权重

  # --- 遗忘曲线 ---
  forgetting:
    strategy: "exponential" # exponential / linear / static
    half_life_hours: 72     # 半衰期（小时），仅 exponential 模式

  # --- 存储 ---
  storage:
    path: "D:/AI/MyClaude/memory_storage/memory1/memory1.json"
    backup_count: 3         # 滚动备份数量

  # --- 检索配置 ---
  retrieval:
    default_top_k: 5        # search() 默认召回条数
    max_top_k: 20           # search() 允许的最大召回条数

  # --- 压缩器 ---
  compressor:
    enabled: true
    model: "default"
    max_tokens_per_batch: 4000

  # --- 注入配置 ---
  injector:
    max_tokens: 2000        # 记忆注入的 token 预算