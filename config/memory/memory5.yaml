# memory5 模块配置 —— 基于 TF-IDF + 余弦相似度

# 数据持久化目录
storage_dir: "memory_storage/memory5"

# 记忆分层容量上限
working_max: 20       # 工作记忆最大条数
short_max: 200        # 短期记忆最大条数
long_max: 1000        # 长期记忆最大条数

# 遗忘策略时间阈值（秒）
working_ttl_seconds: 3600      # 工作记忆：1 小时未访问即遗忘
short_ttl_seconds: 86400       # 短期记忆：24 小时未访问即遗忘
long_ttl_seconds: 604800       # 长期记忆：7 天未访问即遗忘

# 长期记忆重要性阈值
# 遗忘时，重要性低于此值的记忆优先清理
importance_threshold: 0.1