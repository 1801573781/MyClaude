# MyClaude 全局配置文件
# 修改后重启生效

# model api_key 配置文件，换到model_key.yaml

# 模型交互基本参数
model_chat:
  initial_max_tokens: 90000  # 单次请求 token 上限，初始化值（如果与 LLM 交互失败，重试的时候，还会增加这个值）
  max_retries: 3             # 与 LLM 交互，如果失败，重试次数
  max_tokens_limit: 640000   # 单次请求 token 上限，最终值（不会比这个更高的）
  temperature: 0.3           # 创造性程度

# 记忆系统存储配置
memory:
  enabled: true                                       # 是否启用记忆模块
  use_new: false                                      # true=src/memory2（Embedding+LLM双路召回），false=src/memory（TF-IDF检索）
  # 统一 Memory 扩展模块选择器（新增，供 src/memory_ex 使用）
  active_module: "memory5"                            # 选择 memory 模块：memory5 / memory6
  config_dir: "config/memory"                         # 模块配置文件目录（相对于项目根）
  storage_path: "D:/AI/MyClaude/.memdir"              # 记忆文件存放路径（两套模块共用）
  max_inject_tokens: 2000                             # 注入上下文的记忆最大 token 数
  similarity_threshold: 0.15                          # 检索相似度阈值
  short_term_max_entries: 50                          # 短期记忆条目数上限（memory1 用）
  short_term_max_tokens: 8000                         # 短期记忆 token 总量上限（memory1 用）
  compress_batch_size: 20                             # 每批压缩条目数（memory1 用）
  working_memory_max_tokens: 2000                     # 工作记忆 token 上限
  long_term_max_inject: 5                             # 注入长期记忆最大条数
  forget_older_than_days: 30                          # 遗忘时间阈值（天）
  forget_importance_below: 0.2                        # 遗忘重要性阈值
  long_term_max_entries: 200                          # 长期记忆条目上限（memory2用，memory1忽略）
  working_memory_max_entries: 20                      # 工作记忆条目上限
  memory_recall_limit: 5                                # 单次记忆召回最大条数（memory5/memory6 共用）
  embedding_top_k: 10                                 # Embedding 粗筛返回数
  llm_top_k: 5                                        # LLM 精排最终返回数
  context_token_budget: 1500                          # 注入上下文 token 预算
  chars_per_token: 2.0                                # 中文字符/token 估算比例
  forgetting_slope: 0.5                               # 遗忘斜率（越大忘得越快）
  forgetting_min: 0.01                                # 最低保留权重
  decay_check_interval: 3600                          # 衰减检查间隔（秒）
  compress_trigger_count: 12                          # 触发压缩的短期记忆阈值
  max_compressed_per_batch: 6                         # 单次压缩最大条数

# 项目基本目录结构
base_path:
  project_root: "D:/AI/MyClaude/"           # 项目根目录
  code_output_root: "D:/AI/MyClaude/src/"   # AI 生成代码的默认输出目录
  logs_root: "D:/AI/MyClaude/log/"          # log默认输出目录
  backups_root: "D:/AI/MyClaude/backups/"   # 备份根目录
  spec_root: "D:/AI/MyClaude/spec/"         # 需求规格根目录
  skill_root: "D:/AI/MyClaude/skill/"       # skill根目录

# 命令行界面配置
cli:
  theme: "monokai"        # rich 主题风格
  typewriter_delay: 0.005 # 打字机效果延迟（秒），0 为关闭
  max_turns: 100           # 工具调用最大轮次
  show_thinking: False    # 是否显示 <thinking> 内容

# log配置
log:
  format: "html"   # 可选 "md" 或 "html"